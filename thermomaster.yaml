substitutions:
  name: "thermomaster"
  friendly_name: "Thermomaster"

  # OpenTherm adapter. Pin names are from the ESP's point of view:
  # ot_in_pin  <- adapter's "OUT" pin
  # ot_out_pin -> adapter's "IN" pin
  ot_in_pin: GPIO16
  ot_out_pin: GPIO17

  # DS18B20 room temperature sensor (needs a 4.7k pull-up to 3V3)
  temp_pin: GPIO18

  # Boiler flow temperature (degC) while heating:
  #   flow = flow_min + flow_gain * (target - room), clamped to flow_min..flow_max
  # Starting values, tune to your house. The boiler's own maximum still applies.
  flow_min: 35
  flow_max: 55
  flow_gain: 10

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Touch controller driver (CST9217) from a community component
external_components:
  - source:
      type: git
      url: https://github.com/shelson/esphome-cst9217

# ---------------------------------------------------------------------------
# Buses
# ---------------------------------------------------------------------------
i2c:
  # Internal bus (CST9217 touch, AXP2101 PMIC, QMI8658 IMU)
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# ---------------------------------------------------------------------------
# Display, backlight and touch
# ---------------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6

light:
  - platform: mipi_spi
    id: display_backlight
    display_id: disp1
    name: "Display Brightness"
    min_brightness: 15
    max_brightness: 255
    default_transition_length: 800ms
    initial_state:
      state: on
      brightness: 100%

touchscreen:
  - platform: cst9217
    i2c_id: bus_a
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true

# ---------------------------------------------------------------------------
# OpenTherm: the ESP is the OpenTherm master and replaces the Remeha iSense.
# ch_enable is controlled by the thermostat below (switch). dhw_enable stays
# true so hot water keeps working like before.
# ---------------------------------------------------------------------------
opentherm:
  in_pin: ${ot_in_pin}
  out_pin: ${ot_out_pin}
  ch_enable: true
  dhw_enable: true

# Boiler flow temperature setpoint (level 0..1 maps to flow_min..flow_max)
output:
  - platform: opentherm
    t_set:
      id: boiler_setpoint
      min_value: ${flow_min}
      max_value: ${flow_max}

# ---------------------------------------------------------------------------
# Room temperature (DS18B20 on one wire) and boiler diagnostics
# ---------------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: ${temp_pin}

sensor:
  - platform: dallas_temp
    id: room_temp
    name: "Room Temperature"
    update_interval: 30s

  # Not every boiler reports every value
  - platform: opentherm
    rel_mod_level:
      name: "Boiler Modulation"
    t_boiler:
      name: "Boiler Flow Temperature"

# ---------------------------------------------------------------------------
# Central heating enable, driven only by the thermostat below.
# Always OFF on boot, so a reboot never leaves the boiler calling for heat.
# ---------------------------------------------------------------------------
switch:
  - platform: opentherm
    ch_enable:
      id: ot_ch_enable
      internal: true
      restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
# Bottom hardware button (BOOT, GPIO0): wake the display and cycle the preset
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: btn_boot
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      - light.turn_on:
          id: display_backlight
          brightness: 100%
      - lvgl.page.show: main_page
      # Also resets LVGL's inactivity timer, so the dim/standby timeouts
      # start counting again from this press
      - lvgl.resume:
      - script.execute: cycle_preset

  # Boiler status (not every boiler reports every value)
  - platform: opentherm
    flame_on:
      name: "Boiler Flame"
    ch_active:
      name: "Boiler Heating Active"
    fault_indication:
      name: "Boiler Fault"

# ---------------------------------------------------------------------------
# Thermostat
# ---------------------------------------------------------------------------
climate:
  - platform: thermostat
    name: "Thermostat"
    id: thermostat_ctrl
    sensor: room_temp

    # Protect the boiler from short cycling
    min_heating_run_time: 120s
    min_heating_off_time: 300s
    min_idle_time: 60s

    # Hysteresis: heat on below target - 0.3, off above target + 0.3
    heat_deadband: 0.3
    heat_overrun: 0.3

    heat_action:
      - switch.turn_on: ot_ch_enable
      - script.execute: update_flow_setpoint
    idle_action:
      - switch.turn_off: ot_ch_enable
    off_mode:
      - switch.turn_off: ot_ch_enable

    # Setting a target temperature by hand (touch screen or Home Assistant)
    # leaves the current preset: back to "no preset". Calls that select a
    # preset (BOOT button, HA preset dropdown) are left alone.
    on_control:
      - lambda: |-
          if ((x.get_target_temperature().has_value() ||
               x.get_target_temperature_low().has_value()) &&
              !x.get_preset().has_value()) {
            id(thermostat_ctrl).preset.reset();
          }

    default_preset: Away
    on_boot_restore_from: memory
    preset:
      - name: Home
        default_target_temperature_low: 18 °C
        mode: heat
      - name: Away
        default_target_temperature_low: 10 °C
        mode: heat
      - name: Sleep
        default_target_temperature_low: 12 °C
        mode: heat

    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_big
    size: 130
    bpp: 4
    glyphs: "0123456789.-"

  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: font_preset
    size: 28
    bpp: 4
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz "

  # Bold, slightly larger font for the OFF label
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: font_off
    size: 34
    bpp: 4
    glyphs: "OF "

# ---------------------------------------------------------------------------
# UI logic
# ---------------------------------------------------------------------------
globals:
  - id: show_set
    type: bool
    initial_value: 'false'

script:
  - id: adjust_target
    parameters:
      delta: float
    then:
      - lambda: |-
          float t = id(thermostat_ctrl).target_temperature;
          if (std::isnan(t)) t = 20.0f;
          t = std::max(5.0f, std::min(30.0f, t + delta));
          auto call = id(thermostat_ctrl).make_call();
          call.set_target_temperature(t);
          call.perform();
      - script.execute: show_set_temporarily

  # Flow temperature follows how far the room is below the target
  - id: update_flow_setpoint
    then:
      - lambda: |-
          float target = id(thermostat_ctrl).target_temperature;
          float cur = id(room_temp).state;
          if (std::isnan(target) || std::isnan(cur)) return;
          float flow = ${flow_min} + ${flow_gain} * (target - cur);
          flow = std::max((float) ${flow_min}, std::min((float) ${flow_max}, flow));
          id(boiler_setpoint).set_level((flow - ${flow_min}) / (float) (${flow_max} - ${flow_min}));

  # Home -> Away -> Sleep -> Home ...
  - id: cycle_preset
    then:
      - lambda: |-
          using namespace esphome::climate;
          auto cur = id(thermostat_ctrl).preset;
          ClimatePreset next = CLIMATE_PRESET_HOME;
          if (cur.has_value()) {
            switch (cur.value()) {
              case CLIMATE_PRESET_HOME:  next = CLIMATE_PRESET_AWAY;  break;
              case CLIMATE_PRESET_AWAY:  next = CLIMATE_PRESET_SLEEP; break;
              case CLIMATE_PRESET_SLEEP: next = CLIMATE_PRESET_HOME;  break;
              default:                   next = CLIMATE_PRESET_HOME;  break;
            }
          }
          auto call = id(thermostat_ctrl).make_call();
          call.set_preset(next);
          call.perform();
      # Show the new preset's target temperature for 2 s
      - script.execute: show_set_temporarily

  - id: show_set_temporarily
    mode: restart
    then:
      - globals.set:
          id: show_set
          value: 'true'
      - script.execute: update_ui
      - delay: 2s
      - globals.set:
          id: show_set
          value: 'false'
      - script.execute: update_ui

  - id: update_ui
    then:
      # Green: from the start up to whichever is lower (set or current)
      - lvgl.arc.update:
          id: arc_green
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur)) cur = set;
            int v = (int) roundf(std::min(cur, set) * 10.0f);
            return std::max(50, std::min(300, v));
      # Red: only when set > current, drawn up to the set temperature
      - lvgl.arc.update:
          id: arc_red
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur) || set <= cur) return 50;
            int v = (int) roundf(set * 10.0f);
            return std::max(50, std::min(300, v));
      # Blue: only when current > set, drawn up to the current temperature
      - lvgl.arc.update:
          id: arc_blue
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            float cur = id(room_temp).state;
            if (std::isnan(set) || std::isnan(cur) || cur <= set) return 50;
            int v = (int) roundf(cur * 10.0f);
            return std::max(50, std::min(300, v));

      # Big number: set temperature for 2 s after a change, else current
      - lvgl.label.update:
          id: lbl_current
          text: !lambda |-
            float v = id(show_set) ? id(thermostat_ctrl).target_temperature
                                   : id(room_temp).state;
            if (std::isnan(v)) return std::string("--.-");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", v);
            return std::string(buf);

      # Preset label at the bottom gap of the ring
      - lvgl.label.update:
          id: lbl_preset
          text: !lambda |-
            auto preset = id(thermostat_ctrl).preset;
            if (!preset.has_value()) return std::string("");
            switch (preset.value()) {
              case esphome::climate::CLIMATE_PRESET_HOME: return std::string("HOME");
              case esphome::climate::CLIMATE_PRESET_AWAY: return std::string("AWAY");
              case esphome::climate::CLIMATE_PRESET_SLEEP: return std::string("SLEEP");
              case esphome::climate::CLIMATE_PRESET_COMFORT: return std::string("COMFORT");
              case esphome::climate::CLIMATE_PRESET_ECO: return std::string("ECO");
              case esphome::climate::CLIMATE_PRESET_BOOST: return std::string("BOOST");
              default: return std::string("NONE");
            }

      # Mode OFF takes priority over the preset: show a bold "OFF" instead
      - if:
          condition:
            lambda: 'return id(thermostat_ctrl).mode == esphome::climate::CLIMATE_MODE_OFF;'
          then:
            - lvgl.widget.hide: lbl_preset
            - lvgl.widget.show: lbl_off
          else:
            - lvgl.widget.show: lbl_preset
            - lvgl.widget.hide: lbl_off

      # Standby label: always shows current room temp + subtle pixel shift for burn-in protection
      - lvgl.label.update:
          id: lbl_standby
          text: !lambda |-
            float cur = id(room_temp).state;
            if (std::isnan(cur)) return std::string("--.-");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", cur);
            return std::string(buf);
          x: !lambda |-
            // Slowly orbits +/- 12 px over time to prevent static pixel wear
            int step = (millis() / 60000) % 4;
            const int offsets[4] = {-12, 0, 12, 0};
            return offsets[step];
          y: !lambda |-
            int step = (millis() / 60000) % 4;
            const int offsets[4] = {0, -12, 0, 12};
            return offsets[step];

      # Background: red while heating, purple while idle
      - if:
          condition:
            lambda: 'return id(thermostat_ctrl).action == esphome::climate::CLIMATE_ACTION_HEATING;'
          then:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0xED4B82
          else:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0xAF52BF

interval:
  - interval: 1s
    then:
      - script.execute: update_ui

  # While heating, refresh the boiler flow setpoint
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(thermostat_ctrl).action == esphome::climate::CLIMATE_ACTION_HEATING;'
          then:
            - script.execute: update_flow_setpoint

# ---------------------------------------------------------------------------
# On-device UI
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  buffer_size: 25%
  on_idle:
    - timeout: 30s
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 40%
    - timeout: 1min
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 10%
        - lvgl.page.show: oled_standby_page
  pages:
    - id: main_page
      widgets:
        # Full-screen background, colour changes with heating state
        - obj:
            id: bg_panel
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_color: 0xAF52BF
            bg_opa: COVER
            scrollable: false

        # Dark track behind the ring
        - arc:
            id: arc_track
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 300
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_width: 30
            arc_color: 0x000000
            arc_opa: 40%
            arc_rounded: false
            indicator:
              arc_opa: TRANSP
            knob:
              bg_opa: TRANSP

        # Red: gap between current and set (set higher)
        - arc:
            id: arc_red
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0xFF3B3B
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Blue: gap between set and current (current higher)
        - arc:
            id: arc_blue
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x3EA6FF
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Green: the part where set and current agree
        - arc:
            id: arc_green
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 200
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x2ECC71
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Big number: current temperature
        - label:
            id: lbl_current
            text: "--.-"
            align: CENTER
            y: 0
            text_font: font_big
            text_color: 0xFFFFFF

        # Preset name positioned in the 90-degree bottom opening of the ring
        - label:
            id: lbl_preset
            text: "HOME"
            align: BOTTOM_MID
            y: -34
            text_font: font_preset
            text_color: 0xCCCCCC

        # Shown instead of the preset label while the mode is OFF
        - label:
            id: lbl_off
            text: "OFF"
            hidden: true
            align: BOTTOM_MID
            y: -34
            text_font: font_off
            text_color: 0xFF9800

        # Invisible touch zones (Top half)
        - obj:
            align: TOP_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: 0.5
            on_long_press_repeat:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: 0.5

        # Invisible touch zones (Bottom half)
        - obj:
            align: BOTTOM_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: -0.5
            on_long_press_repeat:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: -0.5

    # Minimal OLED Power-Saving Standby Page
    - id: oled_standby_page
      widgets:
        - obj:
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: COVER
            scrollable: false

        - label:
            id: lbl_standby
            text: "--.-"
            align: CENTER
            x: 0
            y: 0
            text_font: font_big
            text_color: 0x444444

        # Full-screen touch catcher to instantly wake up the display anywhere
        - obj:
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
