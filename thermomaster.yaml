substitutions:
  name: "thermomaster"
  friendly_name: "Thermomaster"
  relay_pin: GPIO18

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Touch controller driver (CST9217) from a community component
external_components:
  - source:
      type: git
      url: https://github.com/shelson/esphome-cst9217

# ---------------------------------------------------------------------------
# Buses
# ---------------------------------------------------------------------------
i2c:
  # Internal bus (CST9217 touch, AXP2101 PMIC, QMI8658 IMU)
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

  # External header bus for temperature/humidity sensor
  - id: bus_b
    sda: GPIO16
    scl: GPIO17
    scan: true

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# ---------------------------------------------------------------------------
# Display, backlight and touch
# ---------------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      offset_width: 6

light:
  - platform: mipi_spi
    id: display_backlight
    display_id: disp1
    name: "Display Brightness"
    min_brightness: 15
    max_brightness: 255
    default_transition_length: 800ms
    initial_state:
      state: on
      brightness: 100%

touchscreen:
  - platform: cst9217
    i2c_id: bus_a
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true

# ---------------------------------------------------------------------------
# Temperature sensor on external header bus_b (GPIO16 / GPIO17)
# ---------------------------------------------------------------------------
sensor:
  - platform: sht3xd
    i2c_id: bus_b
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Room Temperature"
      id: room_temp
    humidity:
      name: "Room Humidity"

# ---------------------------------------------------------------------------
# Relay: dry contact across the boiler's thermostat terminals (GPIO18)
# Always OFF on boot, so a reboot never leaves the boiler calling for heat.
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: boiler_relay
    name: "Boiler Relay"
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
# Thermostat
# ---------------------------------------------------------------------------
climate:
  - platform: thermostat
    name: "Thermostat"
    id: thermostat_ctrl
    sensor: room_temp

    # Protect the boiler from short cycling
    min_heating_run_time: 120s
    min_heating_off_time: 300s
    min_idle_time: 60s

    # Hysteresis: heat on below target - 0.3, off above target + 0.3
    heat_deadband: 0.3
    heat_overrun: 0.3

    heat_action:
      - switch.turn_on: boiler_relay
    idle_action:
      - switch.turn_off: boiler_relay
    off_mode:
      - switch.turn_off: boiler_relay

    default_preset: Home
    on_boot_restore_from: memory
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
      - name: Away
        default_target_temperature_low: 16 °C
      - name: Sleep
        default_target_temperature_low: 17 °C

    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_big
    size: 130
    bpp: 4
    glyphs: "0123456789.-"

# ---------------------------------------------------------------------------
# UI logic
# ---------------------------------------------------------------------------
globals:
  - id: show_set
    type: bool
    initial_value: 'false'

script:
  - id: adjust_target
    parameters:
      delta: float
    then:
      - lambda: |-
          float t = id(thermostat_ctrl).target_temperature;
          if (std::isnan(t)) t = 20.0f;
          t = std::max(5.0f, std::min(30.0f, t + delta));
          auto call = id(thermostat_ctrl).make_call();
          call.set_target_temperature(t);
          call.perform();
      - script.execute: show_set_temporarily

  - id: show_set_temporarily
    mode: restart
    then:
      - globals.set:
          id: show_set
          value: 'true'
      - script.execute: update_ui
      - delay: 2s
      - globals.set:
          id: show_set
          value: 'false'
      - script.execute: update_ui

  - id: update_ui
    then:
      # Green: from the start up to whichever is lower (set or current)
      - lvgl.arc.update:
          id: arc_green
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur)) cur = set;
            int v = (int) roundf(std::min(cur, set) * 10.0f);
            return std::max(50, std::min(300, v));
      # Red: only when set > current, drawn up to the set temperature
      - lvgl.arc.update:
          id: arc_red
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur) || set <= cur) return 50;
            int v = (int) roundf(set * 10.0f);
            return std::max(50, std::min(300, v));
      # Blue: only when current > set, drawn up to the current temperature
      - lvgl.arc.update:
          id: arc_blue
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            float cur = id(room_temp).state;
            if (std::isnan(set) || std::isnan(cur) || cur <= set) return 50;
            int v = (int) roundf(cur * 10.0f);
            return std::max(50, std::min(300, v));

      # Big number: set temperature for 2 s after a change, else current
      - lvgl.label.update:
          id: lbl_current
          text: !lambda |-
            float v = id(show_set) ? id(thermostat_ctrl).target_temperature
                                   : id(room_temp).state;
            if (std::isnan(v)) return std::string("--.-");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", v);
            return std::string(buf);

      # Standby label: always shows current room temp + subtle pixel shift for burn-in protection
      - lvgl.label.update:
          id: lbl_standby
          text: !lambda |-
            float cur = id(room_temp).state;
            if (std::isnan(cur)) return std::string("--.-");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", cur);
            return std::string(buf);
          x: !lambda |-
            // Slowly orbits +/- 12 px over time to prevent static pixel wear
            int step = (millis() / 60000) % 4;
            const int offsets[4] = {-12, 0, 12, 0};
            return offsets[step];
          y: !lambda |-
            int step = (millis() / 60000) % 4;
            const int offsets[4] = {0, -12, 0, 12};
            return offsets[step];

      # Background: red while heating, purple while idle
      - if:
          condition:
            switch.is_on: boiler_relay
          then:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0x8B1A1A
          else:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0x4B2A85

interval:
  - interval: 1s
    then:
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# On-device UI
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  buffer_size: 25%
  on_idle:
    - timeout: 30s
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 40%
    - timeout: 1min
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 10%
        - lvgl.page.show: oled_standby_page
  pages:
    - id: main_page
      widgets:
        # Full-screen background, colour changes with heating state
        - obj:
            id: bg_panel
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_color: 0x4B2A85
            bg_opa: COVER
            scrollable: false

        # Dark track behind the ring
        - arc:
            id: arc_track
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 300
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_width: 30
            arc_color: 0x000000
            arc_opa: 40%
            arc_rounded: false
            indicator:
              arc_opa: TRANSP
            knob:
              bg_opa: TRANSP

        # Red: gap between current and set (set higher)
        - arc:
            id: arc_red
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0xFF3B3B
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Blue: gap between set and current (current higher)
        - arc:
            id: arc_blue
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x3EA6FF
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Green: the part where set and current agree
        - arc:
            id: arc_green
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 200
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x2ECC71
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Big number: current temperature
        - label:
            id: lbl_current
            text: "--.-"
            align: CENTER
            y: 0
            text_font: font_big
            text_color: 0xFFFFFF

        # Invisible touch zones (Top half)
        - obj:
            align: TOP_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: 0.5
            on_long_press_repeat:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: 0.5

        # Invisible touch zones (Bottom half)
        - obj:
            align: BOTTOM_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: -0.5
            on_long_press_repeat:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page
              - script.execute:
                  id: adjust_target
                  delta: -0.5

    # Minimal OLED Power-Saving Standby Page
    - id: oled_standby_page
      widgets:
        - obj:
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: COVER
            scrollable: false

        - label:
            id: lbl_standby
            text: "--.-"
            align: CENTER
            x: 0
            y: 0
            text_font: font_big
            text_color: 0x444444

        # Full-screen touch catcher to instantly wake up the display anywhere
        - obj:
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on:
                  id: display_backlight
                  brightness: 100%
              - lvgl.page.show: main_page