substitutions:
  name: "thermomaster"
  friendly_name: "Thermomaster"
  relay_pin: GPIO16

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Touch controller driver (CST9217) from a community component
external_components:
  - source:
      type: git
      url: https://github.com/shelson/esphome-cst9217

# ---------------------------------------------------------------------------
# Buses
# ---------------------------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO15
    scl: GPIO14
    scan: true

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO38
    data_pins:
      - GPIO4
      - GPIO5
      - GPIO6
      - GPIO7

# ---------------------------------------------------------------------------
# Display, backlight and touch (from the ESPHome devices page for this board)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: disp1
    model: CO5300
    bus_mode: quad
    reset_pin: GPIO39
    cs_pin: GPIO12
    dimensions:
      height: 466
      width: 466
      # The CO5300 panel on this board starts 6 columns into the controller's
      # memory (Waveshare's own driver uses a 6 px column offset). Without it
      # the picture is shifted and a stray strip shows at the right edge.
      offset_width: 6

output:
  - platform: template
    id: backlight_brightness
    type: float
    write_action:
      then:
        - lambda: |-
            id(disp1).set_brightness(state * 255);

light:
  - platform: monochromatic
    id: display_backlight
    name: "Backlight"
    output: backlight_brightness
    default_transition_length:
      milliseconds: 200
    initial_state:
      brightness: 100%
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: cst9217
    display: disp1
    id: ts_disp1
    interrupt_pin: GPIO11
    reset_pin: GPIO40
    transform:
      mirror_x: true
      mirror_y: true

# ---------------------------------------------------------------------------
# Temperature sensor: SHT31 on the shared I2C bus (put it on a short cable,
# away from the board: the AMOLED and ESP32 warm up and skew the reading)
# ---------------------------------------------------------------------------
sensor:
  - platform: sht3xd
    i2c_id: bus_a
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Room Temperature"
      id: room_temp
      # filters:
      #   - offset: -0.5
    humidity:
      name: "Room Humidity"

# ---------------------------------------------------------------------------
# Relay: dry contact across the boiler's thermostat terminals.
# Always OFF on boot, so a reboot never leaves the boiler calling for heat.
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: boiler_relay
    name: "Boiler Relay"
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF

# ---------------------------------------------------------------------------
# Thermostat
# ---------------------------------------------------------------------------
climate:
  - platform: thermostat
    name: "Thermostat"
    id: thermostat_ctrl
    sensor: room_temp

    # Protect the boiler from short cycling
    min_heating_run_time: 120s
    min_heating_off_time: 300s
    min_idle_time: 60s

    # Hysteresis: heat on below target - 0.3, off above target + 0.3
    heat_deadband: 0.3
    heat_overrun: 0.3

    heat_action:
      - switch.turn_on: boiler_relay
    idle_action:
      - switch.turn_off: boiler_relay
    # "off" mode: make sure the relay is open
    off_mode:
      - switch.turn_off: boiler_relay

    default_preset: Home
    on_boot_restore_from: memory
    preset:
      - name: Home
        default_target_temperature_low: 20 °C
      - name: Away
        default_target_temperature_low: 16 °C
      - name: Sleep
        default_target_temperature_low: 17 °C

    visual:
      min_temperature: 5 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C

# ---------------------------------------------------------------------------
# Fonts: the built-in LVGL fonts stop at 48 px, so the big temperature uses
# a Google Font that is downloaded at compile time (digits only).
# ---------------------------------------------------------------------------
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_big
    size: 130
    bpp: 4
    glyphs: "0123456789.-"

# ---------------------------------------------------------------------------
# UI logic
#   Ring scale: 5.0 - 30.0 °C, handled in tenths of a degree (50 - 300)
# ---------------------------------------------------------------------------
globals:
  # true while the big number shows the set temperature
  - id: show_set
    type: bool
    initial_value: 'false'

script:
  # Change the target temperature by `delta` degrees (clamped to 5 - 30)
  - id: adjust_target
    parameters:
      delta: float
    then:
      - lambda: |-
          float t = id(thermostat_ctrl).target_temperature;
          if (std::isnan(t)) t = 20.0f;
          t = std::max(5.0f, std::min(30.0f, t + delta));
          auto call = id(thermostat_ctrl).make_call();
          call.set_target_temperature(t);
          call.perform();
      - script.execute: show_set_temporarily

  # Show the set temperature for 2 s after a change, then go back to the
  # current temperature. Every new tap restarts the 2 s.
  - id: show_set_temporarily
    mode: restart
    then:
      - globals.set:
          id: show_set
          value: 'true'
      - script.execute: update_ui
      - delay: 2s
      - globals.set:
          id: show_set
          value: 'false'
      - script.execute: update_ui

  # Redraw ring, labels and background colour
  - id: update_ui
    then:
      # Green: from the start up to whichever is lower (set or current)
      - lvgl.arc.update:
          id: arc_green
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur)) cur = set;
            int v = (int) roundf(std::min(cur, set) * 10.0f);
            return std::max(50, std::min(300, v));
      # Red: only when set > current, drawn up to the set temperature
      - lvgl.arc.update:
          id: arc_red
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            if (std::isnan(set)) return 50;
            float cur = id(room_temp).state;
            if (std::isnan(cur) || set <= cur) return 50;
            int v = (int) roundf(set * 10.0f);
            return std::max(50, std::min(300, v));
      # Blue: only when current > set, drawn up to the current temperature
      - lvgl.arc.update:
          id: arc_blue
          value: !lambda |-
            float set = id(thermostat_ctrl).target_temperature;
            float cur = id(room_temp).state;
            if (std::isnan(set) || std::isnan(cur) || cur <= set) return 50;
            int v = (int) roundf(cur * 10.0f);
            return std::max(50, std::min(300, v));

      # Big number: set temperature for 2 s after a change, else current
      - lvgl.label.update:
          id: lbl_current
          text: !lambda |-
            float v = id(show_set) ? id(thermostat_ctrl).target_temperature
                                   : id(room_temp).state;
            if (std::isnan(v)) return std::string("--.-");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", v);
            return std::string(buf);

      # Background: red while heating, purple while idle
      - if:
          condition:
            switch.is_on: boiler_relay
          then:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0x8B1A1A
          else:
            - lvgl.widget.update:
                id: bg_panel
                bg_color: 0x4B2A85

interval:
  - interval: 1s
    then:
      - script.execute: update_ui

# ---------------------------------------------------------------------------
# On-device UI
#   - big current temperature in the middle
#   - 270 degree ring: green = set temperature, red = still to heat,
#     blue = above target
#   - tap the top half to raise the target, the bottom half to lower it
#     (hold to repeat)
# ---------------------------------------------------------------------------
lvgl:
  displays:
    - disp1
  touchscreens:
    - ts_disp1
  buffer_size: 25%
  pages:
    - id: main_page
      widgets:
        # Full-screen background, colour changes with heating state
        - obj:
            id: bg_panel
            align: CENTER
            width: 466
            height: 466
            radius: 0
            border_width: 0
            bg_color: 0x4B2A85
            bg_opa: COVER
            scrollable: false

        # Dark track behind the ring (keeps the coloured parts readable on
        # both the purple and the red background)
        - arc:
            id: arc_track
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 300
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_width: 30
            arc_color: 0x000000
            arc_opa: 40%
            arc_rounded: false
            indicator:
              arc_opa: TRANSP
            knob:
              bg_opa: TRANSP

        # Red: gap between current and set (set higher)
        - arc:
            id: arc_red
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0xFF3B3B
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Blue: gap between set and current (current higher)
        - arc:
            id: arc_blue
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 50
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x3EA6FF
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # Green: the part where set and current agree (drawn on top)
        - arc:
            id: arc_green
            align: CENTER
            width: 436
            height: 436
            adjustable: false
            min_value: 50
            max_value: 300
            value: 200
            start_angle: 135
            end_angle: 45
            rotation: 0
            bg_opa: TRANSP
            border_width: 0
            arc_opa: TRANSP
            indicator:
              arc_color: 0x2ECC71
              arc_width: 30
              arc_rounded: false
            knob:
              bg_opa: TRANSP

        # The only text: current temperature (set temperature for 2 s
        # after a tap)
        - label:
            id: lbl_current
            text: "--.-"
            align: CENTER
            y: 0
            text_font: font_big
            text_color: 0xFFFFFF

        # Invisible touch zones (kept last so they sit on top)
        - obj:
            align: TOP_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on: display_backlight
              - script.execute:
                  id: adjust_target
                  delta: 0.5
            on_long_press_repeat:
              - script.execute:
                  id: adjust_target
                  delta: 0.5
        - obj:
            align: BOTTOM_MID
            width: 466
            height: 233
            radius: 0
            border_width: 0
            bg_opa: TRANSP
            scrollable: false
            on_short_click:
              - light.turn_on: display_backlight
              - script.execute:
                  id: adjust_target
                  delta: -0.5
            on_long_press_repeat:
              - script.execute:
                  id: adjust_target
                  delta: -0.5
