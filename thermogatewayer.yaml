substitutions:
  name: "thermogatewayer"
  friendly_name: "Thermogatewayer"

  # OpenTherm adapter. Pin names are from the ESP's point of view:
  # ot_in_pin  <- adapter's "OUT" pin
  # ot_out_pin -> adapter's "IN" pin
  ot_in_pin: GPIO21
  ot_out_pin: GPIO22

  # Node name of the display/thermostat that sends heat demand + flow setpoint
  thermostat_node: "thermomaster"

  # No packet from the thermostat for this long: central heating off
  link_timeout_ms: "300000"

# flow_min/flow_max (shared with the display)
packages:
  heating: !include common/heating.yaml

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf

logger:

api:
  # Keep running when Home Assistant is down (default: reboot after 15 min)
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Keep running when Wi-Fi is down (default: reboot after 15 min)
  reboot_timeout: 0s
  # Keep the radio awake. The ESP32 default (light) sleeps between router
  # beacons and misses most ESP-NOW packets.
  power_save_mode: none

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # Flow temperature requested by the thermostat (degC), once per link.
  # Every packet carries it, so it doubles as the "packet received" signal.
  - platform: packet_transport
    transport_id: link_udp
    provider: ${thermostat_node}
    remote_id: flow_setpoint
    id: flow_udp
    on_value:
      - lambda: |-
          id(last_rx_udp) = millis();
          id(rx_count_udp) += 1;
      - script.execute: apply_demand

  - platform: packet_transport
    transport_id: link_espnow
    provider: ${thermostat_node}
    remote_id: flow_setpoint
    id: flow_espnow
    on_value:
      - lambda: |-
          id(last_rx_espnow) = millis();
          id(rx_count_espnow) += 1;
      - script.execute: apply_demand

  # The flow temperature actually in use (from the most recent link)
  - platform: template
    id: requested_flow
    name: "Requested Flow Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 10s
    lambda: 'return id(active_flow);'

  # Packets received per link since boot, to compare link stability
  - platform: template
    name: "UDP Packets"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(rx_count_udp);'

  - platform: template
    name: "ESP-NOW Packets"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(rx_count_espnow);'

  # Not every boiler reports every value
  - platform: opentherm
    rel_mod_level:
      name: "Boiler Modulation"
    t_boiler:
      name: "Boiler Flow Temperature"

# ---------------------------------------------------------------------------
# Links to the thermostat. It sends every packet over both, encrypted, and
# whichever arrives is used:
# - UDP broadcast over Wi-Fi (needs the router, both on the same subnet)
# - ESP-NOW, directly between the ESPs (follows the router's Wi-Fi channel)
# ---------------------------------------------------------------------------
udp:

espnow:
  # Packets from unknown senders are dropped, so accept the thermostat as a
  # peer when it first sends. packet_transport still checks the encryption key.
  auto_add_peer: true

packet_transport:
  - platform: udp
    id: link_udp
    providers:
      - name: ${thermostat_node}
        encryption: !secret transport_key

  - platform: espnow
    id: link_espnow
    providers:
      - name: ${thermostat_node}
        encryption: !secret transport_key

# ---------------------------------------------------------------------------
# OpenTherm: this ESP is the OpenTherm master and replaces the Remeha iSense.
# dhw_enable stays true so hot water keeps working like before.
# ---------------------------------------------------------------------------
opentherm:
  in_pin: ${ot_in_pin}
  out_pin: ${ot_out_pin}
  ch_enable: true
  dhw_enable: true

# Boiler flow temperature setpoint (level 0..1 maps to flow_min..flow_max)
output:
  - platform: opentherm
    t_set:
      id: boiler_setpoint
      min_value: ${flow_min}
      max_value: ${flow_max}

# Central heating enable, driven only by apply_demand.
# Always OFF on boot, so a reboot never leaves the boiler calling for heat.
switch:
  - platform: opentherm
    ch_enable:
      id: ot_ch_enable
      internal: true
      restore_mode: ALWAYS_OFF

binary_sensor:
  # Heat demand from the thermostat, once per link
  - platform: packet_transport
    transport_id: link_udp
    provider: ${thermostat_node}
    remote_id: heat_demand
    id: demand_udp
    on_state:
      - script.execute: apply_demand

  - platform: packet_transport
    transport_id: link_espnow
    provider: ${thermostat_node}
    remote_id: heat_demand
    id: demand_espnow
    on_state:
      - script.execute: apply_demand

  # The heat demand actually in use (from the most recent link)
  - platform: template
    name: "Heat Demand"
    lambda: 'return id(active_demand);'

  # Link status: a packet within the last minute (sent every 10 s)
  - platform: template
    name: "UDP Link"
    device_class: connectivity
    lambda: |-
      return id(last_rx_udp) != 0 && (millis() - id(last_rx_udp)) < 60000;

  - platform: template
    name: "ESP-NOW Link"
    device_class: connectivity
    lambda: |-
      return id(last_rx_espnow) != 0 && (millis() - id(last_rx_espnow)) < 60000;

  # Boiler status (not every boiler reports every value)
  - platform: opentherm
    flame_on:
      name: "Boiler Flame"
    ch_active:
      name: "Boiler Heating Active"
    fault_indication:
      name: "Boiler Fault"

globals:
  # millis() of the last packet per link, 0 = never
  - id: last_rx_udp
    type: uint32_t
    initial_value: '0'
  - id: last_rx_espnow
    type: uint32_t
    initial_value: '0'
  - id: rx_count_udp
    type: uint32_t
    initial_value: '0'
  - id: rx_count_espnow
    type: uint32_t
    initial_value: '0'
  # What apply_demand last sent to the boiler
  - id: active_demand
    type: bool
    initial_value: 'false'
  - id: active_flow
    type: float
    initial_value: 'NAN'

script:
  # Use the link with the most recent packet. Heat only while the thermostat
  # asks for it AND that packet is recent. No packet on either link for
  # link_timeout_ms, or a missing setpoint, switches central heating off.
  - id: apply_demand
    then:
      - lambda: |-
          uint32_t now = millis();
          uint32_t age_udp = id(last_rx_udp) ? now - id(last_rx_udp) : UINT32_MAX;
          uint32_t age_espnow = id(last_rx_espnow) ? now - id(last_rx_espnow) : UINT32_MAX;
          bool use_udp = age_udp <= age_espnow;
          uint32_t age = use_udp ? age_udp : age_espnow;
          bool demand = use_udp ? id(demand_udp).state : id(demand_espnow).state;
          float flow = use_udp ? id(flow_udp).state : id(flow_espnow).state;

          if (age < ${link_timeout_ms} && demand && !std::isnan(flow)) {
            flow = std::max((float) ${flow_min}, std::min((float) ${flow_max}, flow));
            id(boiler_setpoint).set_level((flow - ${flow_min}) / (float) (${flow_max} - ${flow_min}));
            id(ot_ch_enable).turn_on();
            id(active_demand) = true;
          } else {
            id(ot_ch_enable).turn_off();
            id(active_demand) = false;
          }
          id(active_flow) = age < ${link_timeout_ms} ? flow : NAN;

interval:
  - interval: 10s
    then:
      - script.execute: apply_demand
